name: deply

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -p "${{ secrets.SSH_PORT }}" \
            -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.HOST }} << 'EOF'

            set -e

            cd /root/page

            git pull --ff-only origin master

          EOF
